ShortDescription: One-click provisioning for your ARM-managed AI agent — no role key, no config file, no terminal.
Description: >-
  The ARM Agent Client is a single signed generic installer (docs/guides/
  03-client-downloader.md, A4): the same binary for every employee, with
  per-user configuration carried by a signed setup token issued at the end
  of the onboarding questionnaire. Run `arm setup` after install, or
  double-click a downloaded .armsetup file — no terminal required.
