<svg viewBox="0 0 480 510" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="employee-path employee-path-desc">
  <title id="employee-path">The employee path: questionnaire to configured, metered agent</title>
  <desc id="employee-path-desc">Four stages an employee moves through, and the artifact that carries state between each: a structured questionnaire response, a signed setup token, a downloaded client, and a configured agent making metered calls.</desc>
  <defs>
    <style>:root {
      --navy: #1E3A8A;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-muted: #94A3B8;
      --border-strong: #CBD5E1;
      --bg-surface: #FFFFFF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --navy: #7FA2FF;
        --text-primary: #F1F5F9;
        --text-secondary: #CBD5E1;
        --text-muted: #7C8AA5;
        --border-strong: #2E3F61;
        --bg-surface: #10192E;
      }
    }
    text { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }</style>
    <marker id="employee-path-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--text-secondary)" />
    </marker>
    <marker id="employee-path-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--navy)" />
    </marker>
  </defs>

  <g>
    <rect x="40" y="16" width="400" height="76" rx="10" fill="var(--bg-surface)" stroke="var(--border-strong)" stroke-width="1.5" />
    <text x="240" y="46" text-anchor="middle" font-size="19" font-weight="600" fill="var(--text-primary)">Questionnaire</text>
    <text x="240" y="70" text-anchor="middle" font-size="12.5" fill="var(--text-secondary)">6–9 multiple-choice questions, no free text</text>
  </g>

  <g>
    <rect x="40" y="150" width="400" height="76" rx="10" fill="var(--bg-surface)" stroke="var(--border-strong)" stroke-width="1.5" />
    <text x="240" y="180" text-anchor="middle" font-size="19" font-weight="600" fill="var(--text-primary)">Signed setup token</text>
    <text x="240" y="204" text-anchor="middle" font-size="12.5" fill="var(--text-secondary)">15-min TTL, single-use, hash-stored</text>
  </g>

  <g>
    <rect x="40" y="284" width="400" height="76" rx="10" fill="var(--bg-surface)" stroke="var(--border-strong)" stroke-width="1.5" />
    <text x="240" y="314" text-anchor="middle" font-size="19" font-weight="600" fill="var(--text-primary)">Signed client</text>
    <text x="240" y="338" text-anchor="middle" font-size="12.5" fill="var(--text-secondary)">One generic binary, all platforms</text>
  </g>

  <g>
    <rect x="40" y="418" width="400" height="76" rx="10" fill="var(--bg-surface)" stroke="var(--border-strong)" stroke-width="1.5" />
    <text x="240" y="448" text-anchor="middle" font-size="19" font-weight="600" fill="var(--text-primary)">Configured, metered agent</text>
    <text x="240" y="472" text-anchor="middle" font-size="12.5" fill="var(--text-secondary)">Package installed, budget attached, stakeholder set</text>
  </g>

  <g>
    <line x1="240" y1="92" x2="240" y2="150" stroke="var(--text-secondary)" stroke-width="1.75" marker-end="url(#employee-path-arrow)" />
    <rect x="120" y="111" width="240" height="20" fill="var(--bg-surface)" />
    <text x="240" y="125" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">structured answers → recommended package</text>
  </g>

  <g>
    <line x1="240" y1="226" x2="240" y2="284" stroke="var(--text-secondary)" stroke-width="1.75" marker-end="url(#employee-path-arrow)" />
    <rect x="139.60000000000002" y="245" width="200.79999999999998" height="20" fill="var(--bg-surface)" />
    <text x="240" y="259" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">activation code or .armsetup file</text>
  </g>

  <g>
    <line x1="240" y1="360" x2="240" y2="418" stroke="var(--text-secondary)" stroke-width="1.75" marker-end="url(#employee-path-arrow)" />
    <rect x="145.2" y="379" width="189.6" height="20" fill="var(--bg-surface)" />
    <text x="240" y="393" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">redeem token → install → verify</text>
  </g>
</svg>
