<svg viewBox="0 0 480 644" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="artifactory artifactory-desc">
  <title id="artifactory">The artifactory: component to installed agent</title>
  <desc id="artifactory-desc">Every artifact an agent can be given moves through the same four states: identity, an immutable versioned manifest, content-addressed bytes, and — via a work package — an installed, verified component on someone's machine.</desc>
  <defs>
    <style>:root {
      --navy: #1E3A8A;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-muted: #94A3B8;
      --border-strong: #CBD5E1;
      --bg-surface: #FFFFFF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --navy: #7FA2FF;
        --text-primary: #F1F5F9;
        --text-secondary: #CBD5E1;
        --text-muted: #7C8AA5;
        --border-strong: #2E3F61;
        --bg-surface: #10192E;
      }
    }
    text { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }</style>
    <marker id="artifactory-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--text-secondary)" />
    </marker>
    <marker id="artifactory-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--navy)" />
    </marker>
  </defs>

  <g>
    <rect x="40" y="16" width="400" height="76" rx="10" fill="var(--bg-surface)" stroke="var(--border-strong)" stroke-width="1.5" />
    <text x="240" y="46" text-anchor="middle" font-size="19" font-weight="600" fill="var(--text-primary)">Component</text>
    <text x="240" y="70" text-anchor="middle" font-size="12.5" fill="var(--text-secondary)">identity, kind, owner, review status</text>
  </g>

  <g>
    <rect x="40" y="150" width="400" height="76" rx="10" fill="var(--bg-surface)" stroke="var(--border-strong)" stroke-width="1.5" />
    <text x="240" y="180" text-anchor="middle" font-size="19" font-weight="600" fill="var(--text-primary)">Component version</text>
    <text x="240" y="204" text-anchor="middle" font-size="12.5" fill="var(--text-secondary)">immutable manifest + optional blob digest</text>
  </g>

  <g>
    <rect x="40" y="284" width="400" height="76" rx="10" fill="var(--bg-surface)" stroke="var(--border-strong)" stroke-width="1.5" />
    <text x="240" y="314" text-anchor="middle" font-size="19" font-weight="600" fill="var(--text-primary)">Content-addressed blob</text>
    <text x="240" y="338" text-anchor="middle" font-size="12.5" fill="var(--text-secondary)">sha256:&lt;hex&gt; — verified on every read</text>
  </g>

  <g>
    <rect x="40" y="418" width="400" height="76" rx="10" fill="var(--bg-surface)" stroke="var(--border-strong)" stroke-width="1.5" />
    <text x="240" y="448" text-anchor="middle" font-size="19" font-weight="600" fill="var(--text-primary)">Work package</text>
    <text x="240" y="472" text-anchor="middle" font-size="12.5" fill="var(--text-secondary)">pinned versions + routing + budget + permissions</text>
  </g>

  <g>
    <rect x="40" y="552" width="400" height="76" rx="10" fill="var(--bg-surface)" stroke="var(--border-strong)" stroke-width="1.5" />
    <text x="240" y="582" text-anchor="middle" font-size="19" font-weight="600" fill="var(--text-primary)">Installed on agent</text>
    <text x="240" y="606" text-anchor="middle" font-size="12.5" fill="var(--text-secondary)">digest re-verified before use</text>
  </g>

  <g>
    <line x1="240" y1="92" x2="240" y2="150" stroke="var(--text-secondary)" stroke-width="1.75" marker-end="url(#artifactory-arrow)" />
    <rect x="111.60000000000002" y="111" width="256.79999999999995" height="20" fill="var(--bg-surface)" />
    <text x="240" y="125" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">publish (review_status = approved required)</text>
  </g>

  <g>
    <line x1="240" y1="226" x2="240" y2="284" stroke="var(--text-secondary)" stroke-width="1.75" marker-end="url(#artifactory-arrow)" />
    <rect x="167.60000000000002" y="245" width="144.79999999999998" height="20" fill="var(--bg-surface)" />
    <text x="240" y="259" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">digest, sha256-verified</text>
  </g>

  <g>
    <line x1="240" y1="360" x2="240" y2="418" stroke="var(--text-secondary)" stroke-width="1.75" marker-end="url(#artifactory-arrow)" />
    <rect x="150.8" y="379" width="178.39999999999998" height="20" fill="var(--bg-surface)" />
    <text x="240" y="393" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">pinned by version, not by tag</text>
  </g>

  <g>
    <line x1="240" y1="494" x2="240" y2="552" stroke="var(--text-secondary)" stroke-width="1.75" marker-end="url(#artifactory-arrow)" />
    <rect x="148" y="513" width="184" height="20" fill="var(--bg-surface)" />
    <text x="240" y="527" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">resolve → pull → verify digest</text>
  </g>
</svg>
