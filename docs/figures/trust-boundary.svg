<svg viewBox="0 0 480 510" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="trust-boundary trust-boundary-desc">
  <title id="trust-boundary">Control plane / data plane split</title>
  <desc id="trust-boundary-desc">The data plane runs inside the customer's VPC and handles every prompt, every resource byte, and every call to a model provider. Only metadata crosses into the control plane; only aggregates leave it toward a dashboard viewer. Derived from arm-spec.md §3.1 and §3.3.</desc>
  <defs>
    <style>:root {
      --navy: #1E3A8A;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-muted: #94A3B8;
      --border-strong: #CBD5E1;
      --bg-surface: #FFFFFF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --navy: #7FA2FF;
        --text-primary: #F1F5F9;
        --text-secondary: #CBD5E1;
        --text-muted: #7C8AA5;
        --border-strong: #2E3F61;
        --bg-surface: #10192E;
      }
    }
    text { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }</style>
    <marker id="trust-boundary-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--text-secondary)" />
    </marker>
    <marker id="trust-boundary-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--navy)" />
    </marker>
  </defs>

  <g>
    <rect x="40" y="16" width="400" height="76" rx="10" fill="var(--bg-surface)" stroke="var(--border-strong)" stroke-width="1.5" />
    <text x="240" y="46" text-anchor="middle" font-size="19" font-weight="600" fill="var(--text-primary)">Local agent</text>
    <text x="240" y="70" text-anchor="middle" font-size="12.5" fill="var(--text-secondary)">opencode / claude code / copilot / Pi, on the employee's machine</text>
  </g>

  <g>
    <rect x="40" y="150" width="400" height="76" rx="10" fill="var(--bg-surface)" stroke="var(--border-strong)" stroke-width="1.5" />
    <text x="240" y="180" text-anchor="middle" font-size="19" font-weight="600" fill="var(--text-primary)">Data plane</text>
    <text x="240" y="204" text-anchor="middle" font-size="12.5" fill="var(--text-secondary)">Closed-proxy, open-gateway, resource connectors — inside the tenant VPC. Calls Anthropic/OpenAI or a self-hosted GPU pool from here.</text>
  </g>

  <g>
    <rect x="40" y="284" width="400" height="76" rx="10" fill="var(--bg-surface)" stroke="var(--border-strong)" stroke-width="1.5" />
    <text x="240" y="314" text-anchor="middle" font-size="19" font-weight="600" fill="var(--text-primary)">Control plane</text>
    <text x="240" y="338" text-anchor="middle" font-size="12.5" fill="var(--text-secondary)">SaaS by default, or self-hosted single-tenant — policy, billing, audit</text>
  </g>

  <g>
    <rect x="40" y="418" width="400" height="76" rx="10" fill="var(--bg-surface)" stroke="var(--border-strong)" stroke-width="1.5" />
    <text x="240" y="448" text-anchor="middle" font-size="19" font-weight="600" fill="var(--text-primary)">Dashboard viewer</text>
    <text x="240" y="472" text-anchor="middle" font-size="12.5" fill="var(--text-secondary)">A human looking at spend, adoption, and audit</text>
  </g>

  <g>
    <line x1="240" y1="92" x2="240" y2="150" stroke="var(--text-secondary)" stroke-width="1.75" marker-end="url(#trust-boundary-arrow)" />
    <rect x="139.60000000000002" y="111" width="200.79999999999998" height="20" fill="var(--bg-surface)" />
    <text x="240" y="125" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">prompts + responses + resource IO</text>
  </g>

  <g>
    <line x1="240" y1="226" x2="240" y2="284" stroke="var(--navy)" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#trust-boundary-arrow-accent)" />
    <rect x="52.80000000000001" y="245" width="374.4" height="20" fill="var(--bg-surface)" />
    <text x="240" y="259" text-anchor="middle" font-size="11.5" fill="var(--navy)">metadata only — tokens, $, audit decisions (never prompt bodies)</text>
  </g>

  <g>
    <line x1="240" y1="360" x2="240" y2="418" stroke="var(--text-secondary)" stroke-width="1.75" marker-end="url(#trust-boundary-arrow)" />
    <rect x="106" y="379" width="268" height="20" fill="var(--bg-surface)" />
    <text x="240" y="393" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">aggregates, per-agent / per-team rollups only</text>
  </g>
</svg>
