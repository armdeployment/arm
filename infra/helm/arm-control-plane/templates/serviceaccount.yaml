{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "arm-control-plane.serviceAccountName" . }}
  labels:
    {{- include "arm-control-plane.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Neither app calls the Kubernetes API, so the token is never needed and
# mounting it only widens what a compromised pod reaches.
automountServiceAccountToken: false
{{- end }}
