# ARM Data Plane Helm Chart — Values
# Tenant overrides injected at install time by `arm data-plane install`.

# ── Naming ──
nameOverride: ""
fullnameOverride: ""

# ── Control plane connection (required) ──
# Both are `required` in the templates rather than defaulted: a proxy that
# starts with an empty CONTROL_PLANE_URL reports healthy and meters nothing,
# which is the worst possible failure for a metering boundary.
controlPlane:
  url: "" # Set at install: https://control.arm.example.com
  tenantId: "" # Set at install: tenant UUID from registration

# ── Closed proxy ──
proxy:
  enabled: true
  replicas: 2 # ignored when autoscaling.enabled — the HPA owns the count
  image:
    repository: arm/closed-proxy
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: "500m", memory: "256Mi" }
    limits: { cpu: "2000m", memory: "512Mi" }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  port: 8787
  env:
    ARM_FAIL_MODE: "fail_closed"
    PROXY_PERFORMANCE_BUDGET_MS: "25" # p50 latency budget (spec §5.2)

# ── Open gateway ──
openGateway:
  enabled: true
  replicas: 1
  image:
    repository: arm/open-gateway
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: "250m", memory: "256Mi" }
    limits: { cpu: "1000m", memory: "512Mi" }
  port: 8788
  vllmEndpoint: "" # Set at install: http://vllm:8000

# ── Meter agent ──
#
# The only path by which what an agent costs reaches the dashboard:
#   proxy → meter-agent (disk buffer) → control plane → ClickHouse
#
# Deliberately ONE replica with a Recreate strategy — it owns a ReadWriteOnce
# buffer volume, and a second replica would either fail to attach or hold
# events nothing else can drain. It is not on the request path (the proxy
# ships asynchronously and never blocks a call on it), so one is enough.
#
# `persistence.enabled: false` makes the buffer an emptyDir, which throws away
# exactly the durability the disk buffer exists to provide. NOTES.txt warns.
meterAgent:
  enabled: true
  port: 8789
  image:
    repository: arm/meter-agent
    tag: latest
    pullPolicy: IfNotPresent
  buffer:
    maxBytes: 1073741024 # 1 GB (spec §5.2)
    maxAgeHours: 24
    dir: /data/meter-buffer
  flushIntervalMs: 30000
  # Shared secret presented to the control plane's ingest endpoint. NOT
  # created by this chart — the chart never holds key material. Leave `name`
  # empty and the agent sends unauthenticated, which the control plane refuses
  # under NODE_ENV=production.
  ingestTokenSecret:
    name: ""
    key: token
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "500m", memory: "256Mi" }

# ── Service account ──
serviceAccount:
  create: true
  name: ""
  # For IRSA / Workload Identity, e.g.
  #   eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/arm-data-plane
  # infra/terraform/main.tf sets exactly this annotation.
  annotations: {}

# ── Service ──
service:
  type: ClusterIP
  proxyPort: 8787
  gatewayPort: 8788
  meterAgentPort: 8789

# ── Ingress (optional) ──
# hosts entries take the shape:
#   - host: proxy.arm.example.com
#     paths:
#       - path: /
#         pathType: Prefix
#         service: proxy      # "proxy" | "gateway"
#         port: 8787
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

# ── Persistence ──
# Backs the meter-agent's event buffer. ReadWriteOnce is fine because the
# meter-agent is a single replica by design; the proxy no longer mounts this
# (it ships over HTTP), which is what made a RWO claim workable at all.
persistence:
  enabled: true
  storageClass: ""
  size: 10Gi

# ── Security context ──
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# ── Monitoring ──
# Requires the Prometheus Operator; the template fails the install with a
# clear message if monitoring.coreos.com/v1 is not present.
serviceMonitor:
  enabled: false
  path: /health
  interval: 30s
  labels: {}

# ── TLS / mTLS ──
# The secret is NOT created by this chart — it never generates or holds key
# material. Create it before installing; NOTES.txt prints the command.
tls:
  controlPlaneMTLS:
    enabled: true
    certSecretName: arm-control-plane-mtls
