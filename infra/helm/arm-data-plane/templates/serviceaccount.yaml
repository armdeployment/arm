{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "arm-data-plane.serviceAccountName" . }}
  labels:
    {{- include "arm-data-plane.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The data plane calls no Kubernetes API, so this token is never needed and
# mounting it only widens the blast radius of a compromised pod.
automountServiceAccountToken: false
{{- end }}
