{{- if and .Values.persistence.enabled .Values.meterAgent.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "arm-data-plane.fullname" . }}-meter-buffer
  labels:
    {{- include "arm-data-plane.labels" . | nindent 4 }}
spec:
  accessModes:
    # ReadWriteOnce is correct here, unlike where this claim used to be
    # mounted. It was on the proxy Deployment, which autoscales 2-10 — every
    # replica past the first would have failed to attach. It now belongs to
    # the meter-agent, which is deliberately a single replica with a Recreate
    # strategy for exactly this reason.
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
