{{- if .Values.proxy.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "arm-data-plane.fullname" . }}-proxy
  labels:
    {{- include "arm-data-plane.labels" . | nindent 4 }}
    # Not `selectorLabels` — that also sets app.kubernetes.io/instance, and a
    # duplicate key in one YAML map is a parse error, not a merge.
    app.kubernetes.io/name: arm-closed-proxy
    app.kubernetes.io/component: closed-proxy
spec:
  {{- if not .Values.proxy.autoscaling.enabled }}
  replicas: {{ .Values.proxy.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "arm-data-plane.selectorLabels" (dict "ctx" . "component" "closed-proxy") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "arm-data-plane.selectorLabels" (dict "ctx" . "component" "closed-proxy") | nindent 8 }}
        app.kubernetes.io/component: closed-proxy
    spec:
      serviceAccountName: {{ include "arm-data-plane.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: proxy
          image: "{{ .Values.proxy.image.repository }}:{{ .Values.proxy.image.tag }}"
          imagePullPolicy: {{ .Values.proxy.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.proxy.port }}
              protocol: TCP
          env:
            - name: PROXY_PORT
              value: "{{ .Values.proxy.port }}"
            - name: ARM_FAIL_MODE
              value: {{ .Values.proxy.env.ARM_FAIL_MODE | quote }}
            - name: PROXY_PERFORMANCE_BUDGET_MS
              value: {{ .Values.proxy.env.PROXY_PERFORMANCE_BUDGET_MS | quote }}
            {{- include "arm-data-plane.controlPlaneEnv" . | nindent 12 }}
            {{- if .Values.meterAgent.enabled }}
            # Where the proxy ships metering events. Unset, the proxy keeps a
            # small in-process debug window and nothing reaches the control
            # plane — which is what "the dashboard shows no spend" looks like.
            - name: METER_AGENT_URL
              value: "http://{{ include "arm-data-plane.fullname" . }}-meter-agent:{{ .Values.service.meterAgentPort }}"
            {{- end }}
            - name: PROXY_QUOTA_STATE_DIR
              value: /var/lib/arm/quota
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.proxy.resources | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem is on, and the entrypoint is
            # `node --import tsx`, which transpiles to a cache under the
            # system temp dir. Without a writable /tmp the container fails at
            # startup rather than at some later write.
            - name: tmp
              mountPath: /tmp
            # Quota consumption, so a restarting pod does not hand every agent
            # its daily cap back. emptyDir, not the buffer PVC: the proxy
            # autoscales, and each replica needs its own writable path.
            # Consequence, stated plainly because it is easy to miss — with
            # more than one replica the cap is enforced PER REPLICA. NOTES.txt
            # says so at install time.
            - name: quota-state
              mountPath: /var/lib/arm/quota
            {{- if .Values.tls.controlPlaneMTLS.enabled }}
            - name: control-plane-mtls
              mountPath: /etc/arm/mtls
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: quota-state
          emptyDir: {}
        {{- if .Values.tls.controlPlaneMTLS.enabled }}
        - name: control-plane-mtls
          secret:
            # NOT created by this chart — the chart never generates or holds
            # key material. Create it out of band before installing; see
            # NOTES.txt for the exact command.
            secretName: {{ .Values.tls.controlPlaneMTLS.certSecretName }}
        {{- end }}
{{- end }}
