apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "arm-data-plane.fullname" . }}-proxy
  labels:
    app.kubernetes.io/name: arm-closed-proxy
    {{- include "arm-data-plane.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.proxy.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: arm-closed-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arm-closed-proxy
    spec:
      containers:
        - name: proxy
          image: "{{ .Values.proxy.image.repository }}:{{ .Values.proxy.image.tag }}"
          imagePullPolicy: {{ .Values.proxy.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.proxy.port }}
              protocol: TCP
          env:
            - name: PROXY_PORT
              value: "{{ .Values.proxy.port }}"
            - name: ARM_FAIL_MODE
              value: {{ .Values.proxy.env.ARM_FAIL_MODE | quote }}
            - name: PROXY_PERFORMANCE_BUDGET_MS
              value: {{ .Values.proxy.env.PROXY_PERFORMANCE_BUDGET_MS | quote }}
            - name: CONTROL_PLANE_URL
              value: {{ .Values.controlPlane.url | quote }}
            - name: TENANT_ID
              value: {{ .Values.controlPlane.tenantId | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.proxy.port }}
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.proxy.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.proxy.resources | nindent 12 }}
          volumeMounts:
            - name: meter-buffer
              mountPath: /data/meter-buffer
      volumes:
        - name: meter-buffer
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "arm-data-plane.fullname" . }}-meter-buffer
          {{- else }}
          emptyDir: {}
          {{- end }}
