{{- if .Values.ingress.enabled }}
{{- $fullName := include "arm-data-plane.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "arm-data-plane.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                # `service: proxy` or `service: gateway`; anything else is a
                # typo that would otherwise route to a name that does not exist.
                name: {{ $fullName }}-{{ .service | default "proxy" }}
                port:
                  number: {{ .port }}
          {{- end }}
    {{- end }}
{{- end }}
