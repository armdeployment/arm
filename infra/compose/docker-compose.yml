# ARM Data Plane — docker-compose (spec §9 1.2)
# Single-node deployment for dev/testing. Production uses Helm + Terraform.

version: "3.8"

services:
  # ── Closed Proxy (OpenAI/Anthropic wire) ──
  closed-proxy:
    build:
      context: ../..
      dockerfile: infra/docker/proxy.Dockerfile
    ports:
      - "${PROXY_PORT:-8787}:8787"
    environment:
      NODE_ENV: production
      PROXY_PORT: "8787"
      # Where metering events go. Without it the proxy keeps an in-process
      # debug window and nothing reaches the control plane — which looks
      # exactly like "the dashboard shows no spend".
      METER_AGENT_URL: http://meter-agent:8789
      # Quota consumption, so a container restart does not hand every agent
      # its daily cap back. Per-container: scale this service and the cap is
      # enforced per replica.
      PROXY_QUOTA_STATE_DIR: /data/quota
      ARM_FAIL_MODE: fail_closed
    volumes:
      - proxy-quota-data:/data/quota
    depends_on:
      - meter-agent
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Meter Agent (buffers metering events, flushes to the control plane) ──
  # The only path by which what an agent costs reaches the dashboard. Its
  # buffer is a named volume on purpose: events survive a restart because they
  # are on disk, and an ephemeral mount gives that back.
  meter-agent:
    build:
      context: ../..
      dockerfile: infra/docker/meter-agent.Dockerfile
    environment:
      NODE_ENV: production
      METER_AGENT_PORT: "8789"
      METER_AGENT_BUFFER_DIR: /data/meter-buffer
      METER_AGENT_FLUSH_INTERVAL_MS: "${METER_AGENT_FLUSH_INTERVAL_MS:-30000}"
      # Unset and the agent buffers forever and reports degraded, rather than
      # pretending the events went somewhere.
      ARM_CONTROL_PLANE_URL: ${ARM_CONTROL_PLANE_URL:-}
      ARM_INGEST_TOKEN: ${ARM_INGEST_TOKEN:-}
    volumes:
      - meter-buffer-data:/data/meter-buffer
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8789/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Open Gateway (vLLM shim) ──
  open-gateway:
    build:
      context: ../..
      dockerfile: infra/docker/open-gateway.Dockerfile
    ports:
      - "${GATEWAY_PORT:-8788}:8788"
    environment:
      NODE_ENV: production
      VLLM_ENDPOINT: ${VLLM_ENDPOINT:-http://vllm:8000}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8788/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Optional: vLLM (self-hosted model server) ──
  # Uncomment to run GLM-5.2 / DeepSeek locally.
  # vllm:
  #   image: vllm/vllm-openai:latest
  #   ports:
  #     - "8000:8000"
  #   command: --model glm-5.2 --port 8000
  #   volumes:
  #     - model-cache:/root/.cache/huggingface
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]

volumes:
  meter-buffer-data:
  proxy-quota-data:
  # model-cache:
